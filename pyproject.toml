[project]
name = "osm2stitch"
version = "0.1.0"
description = "Embroidery files from OpenStreetMap data (via Ink/Stitch)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "osmium>=4.3.2",
    "pyembroidery>=1.5.1",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "playwright>=1.64.1",
]
